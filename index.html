<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Project Portfolio</title>
  <meta name="description" content="A modern portfolio of projects across Web, AI, Python, CAD, and Electronics." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Header -->
  <header class="site-header">
    <div class="container header-inner">
      <div class="brand">
        <span class="brand-dot"></span>
        <h1>Portfolio<span class="accent">.</span></h1>
      </div>
      <p class="tagline">A collection of things I've designed, coded, and built.</p>
      <!-- Search bar -->
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="search" type="text" placeholder="Search projects, tags, tech…" autocomplete="off" />
      </div>
      <!-- Category filters (populated by JS) -->
      <nav id="filters" class="filters" aria-label="Category filters"></nav>
    </div>
  </header>
  <!-- Masonry gallery -->
  <main class="container">
    <section id="gallery" class="masonry" aria-live="polite"></section>
    <p id="empty" class="empty hidden">No projects match your search.</p>
  </main>
  <footer class="site-footer">
    <div class="container">
      <p>© <span id="year"></span> — Built with plain HTML, CSS & JS.</p>
    </div>
  </footer>
  <!-- Modal -->
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-panel">
      <button class="modal-close" data-close aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
      <div id="modal-content" class="modal-content"></div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
